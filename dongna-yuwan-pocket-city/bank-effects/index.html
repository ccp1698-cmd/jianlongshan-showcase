function shade(hex, f){
  const n = parseInt(hex.slice(1), 16);
  const c = v => Math.max(0, Math.min(255, Math.round(v*f)));
  return 'rgb(' + c(n>>16) + ',' + c((n>>8)&255) + ',' + c(n&255) + ')';
}
function rgba(rgb, a){
  const m = rgb.match(/\d+/g);
  return 'rgba(' + m[0] + ',' + m[1] + ',' + m[2] + ',' + a + ')';
}

  {no:5, name:'沙滩边', desc:'岸边一圈淡沙色，像沙滩；岛岸和大陆河岸都有。', kind:'sand'},
  {no:6, name:'深水渐变', desc:'近岸水浅色、中间水深色，颜色慢慢过渡，没有硬边。', kind:'grad'},
];

function drawPanel(cv, kind){
  const dpr = window.devicePixelRatio || 1;
  const cw = cv.clientWidth, ch = cv.clientHeight;
  if(!cw || !ch) return;
  cv.width = Math.round(cw*dpr);
  cv.height = Math.round(ch*dpr);
  const c = cv.getContext('2d');
  const VH = VW * (ch/cw);
  const s = Math.min(cw/VW, ch/VH) * dpr; // device px per plane unit
  const k = s / U; // unit-space px -> device px
  c.setTransform(1,0,0,1,0,0);
  c.fillStyle = PAPER;
  c.fillRect(0, 0, cv.width, cv.height);
  c.setTransform(k, 0, 0, k, cv.width/2 - s*VCX, cv.height/2 - s*VCY);

  function pathPts(pts){
    c.beginPath();
    pts.forEach((p,i)=>{ const f=flat(p[0],p[1]); i?c.lineTo(f[0],f[1]):c.moveTo(f[0],f[1]); });
    c.closePath();
  }
  function riverPath(){
    c.beginPath();
    for(const lp of BANK.riverPath){
      lp.forEach((p,i)=>{ const f=flat(p[0],p[1]); i?c.lineTo(f[0],f[1]):c.moveTo(f[0],f[1]); });
      c.closePath();
    }
  }
  function strokeShore(color, w, dash){
    c.strokeStyle = color; c.lineWidth = w; c.lineJoin='round'; c.lineCap='round';
    c.setLineDash(dash||[]);
    for(const lp of BANK.riverPath){ pathPts(lp); c.stroke(); }
    for(const isl of Object.values(BANK.islands)){ pathPts(isl); c.stroke(); }
    c.setLineDash([]);
  }
  function clipWater(){ c.save(); riverPath(); c.clip('evenodd'); }
  function waterline(){ strokeShore(WHITE_LINE, 1.6); }
  function drawBase(riverFill){
    c.fillStyle = ISLAND; pathPts(BANK.ring); c.fill();
    c.fillStyle = riverFill; riverPath(); c.fill('evenodd');
    c.fillStyle = ISLAND;
    for(const isl of Object.values(BANK.islands)){ pathPts(isl); c.fill(); }
  }

  if(kind==='orig'){
    drawBase(RIVER);
    waterline();
  } else if(kind==='band'){
    // r18: pale-teal band clipped to the water + thin white waterline
    drawBase(RIVER);
    clipWater();
    strokeShore(shade(RIVER,1.3), 12);
    c.restore();
    waterline();
  } else if(kind==='foam'){
    // white dashed foam line along the bank + thin white waterline
    drawBase(RIVER);
    clipWater();
    strokeShore('rgba(255,255,255,0.9)', 7, [6,4]);
    c.restore();
    waterline();
  } else if(kind==='shadow'){
    // soft dark shadow: several strokes, wide+faint -> narrow+dark, clipped to water
    drawBase(RIVER);
    clipWater();
    const dark = shade(RIVER,0.5);
    [[16,0.06],[11,0.10],[7,0.16],[4,0.24]].forEach(([w,a])=>strokeShore(rgba(dark,a), w));
    c.restore();
  } else if(kind==='sand'){
    // pale sand band straddling the shoreline (not clipped: half on land, half in water)
    drawBase(RIVER);
    strokeShore(SAND, 8);
  } else if(kind==='grad'){
    // darker river + soft light fade near the banks, no hard edge
    drawBase(shade(RIVER,0.85));
    clipWater();
    const light = shade(RIVER,1.35);
    [[16,0.10],[11,0.18],[7,0.28],[4,0.40]].forEach(([w,a])=>strokeShore(rgba(light,a), w));
    c.restore();
  }
}

function build(){
  const grid = document.getElementById('grid');
  const cvs = EFFECTS.map(eff=>{
    const card = document.createElement('div');
    card.className = 'card';
    const cv = document.createElement('canvas');
    card.appendChild(cv);
    const cap = document.createElement('div');
    cap.className = 'cap';
    cap.innerHTML = '<h2><span class="no">' + eff.no + '</span>' + eff.name + '</h2><p>' + eff.desc + '</p>';
    card.appendChild(cap);
    grid.appendChild(card);
    return [cv, eff.kind];
  });
  function drawAll(){ cvs.forEach(([cv,kind])=>drawPanel(cv, kind)); }
  drawAll();
  let t = null;
  window.addEventListener('resize', ()=>{ clearTimeout(t); t = setTimeout(drawAll, 150); });
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', build);
else build();
</script>
</body>
