<!doctype html>
<html lang="zh-CN">
<head>
<link rel="icon" href="data:,">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>剑龙山 · 3D 地图（Cesium 真实感版 v1）</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.147.0/Build/Cesium/Widgets/widgets.css">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1220;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  #cesiumContainer{position:absolute;inset:0}
  #cesiumContainer .cesium-widget{position:absolute;inset:0;width:100%;height:100%}
  #cesiumContainer canvas{display:block;width:100%;height:100%}
  #title{position:fixed;left:12px;top:12px;color:#fff;background:rgba(10,20,35,.62);padding:10px 14px;border-radius:10px;max-width:340px;z-index:5}
  #title h1{margin:0;font-size:17px;line-height:1.35}
  #title p{margin:4px 0 0;font-size:12px;line-height:1.5;color:#cfe0ef}
  #title .tag{display:inline-block;margin-top:6px;font-size:11px;background:#2f7fc4;color:#fff;border-radius:20px;padding:2px 8px}
  #views{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:nowrap;justify-content:flex-start;max-width:96vw;z-index:5;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #views::-webkit-scrollbar{display:none}
  #views button{border:1px solid rgba(255,255,255,.35);background:rgba(10,20,35,.66);color:#fff;font-size:13px;padding:7px 12px;border-radius:20px;cursor:pointer;white-space:nowrap;flex-shrink:0}
  #views button.active{background:#2f7fc4;border-color:#2f7fc4}
  #legend{position:fixed;left:12px;bottom:14px;color:#fff;background:rgba(10,20,35,.62);padding:8px 10px;border-radius:8px;font-size:12px;line-height:1.7;z-index:5}
  #legend i{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
  #status{position:fixed;right:12px;bottom:14px;color:#cfe0ef;background:rgba(10,20,35,.55);padding:6px 8px;border-radius:8px;font-size:11px;line-height:1.5;max-width:300px;z-index:5}
  .cesium-widget-credits{font-size:10px !important}
  @media (max-width:640px){
    #title{max-width:250px;padding:8px 10px}#title h1{font-size:15px}
    #views button{font-size:12px;padding:6px 10px}
    #legend{display:none}
    #status{display:none}
  }
</style>
<!-- Cesium 库走 jsdelivr CDN（1.147.0，版本不变；Workers/Assets 由 Cesium.js 按自身 URL 解析）。
     GitHub 连接器只接受文本上传，本地 dist/cesium/ 里 179 个二进制文件（贴图/wasm）传不上去。
     页面本就依赖 Esri 影像外链，再加一个库外链是同类依赖。 -->
<script>window.CESIUM_BASE_URL = 'https://cdn.jsdelivr.net/npm/cesium@1.147.0/Build/Cesium/';</script>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.147.0/Build/Cesium/Cesium.js"></script>
<script type="module" src="./main.js"></script>
</head>
<body>
<div id="cesiumContainer"></div>
<div id="title">
  <h1>剑龙山 · 3D 地图</h1>
  <p>Cesium 真实感版 v1 · 真实 DEM 地形 + 卫星影像<br>定位、聊天助手下一阶段加入</p>
  <span class="tag">v1 真实感版</span>
</div>
<div id="views"></div>
<div id="legend">
  <div><i style="background:#e0651f"></i>徒步路线（穿四峰）</div>
  <div><i style="background:#9aa0a6"></i>公路</div>
  <div><i style="background:#6f9a7d"></i>伏曼水库（卫星实景水面）</div>
</div>
<div id="status">加载中…</div>
</body>
</html>
